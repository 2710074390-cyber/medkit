name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      # P2#14：跨平台矩阵 —— Windows 覆盖打包/路径/命令差异，Ubuntu 快速主通道
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          # P2#14：依赖缓存，命中则跳过安装，加速多平台重复运行
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - name: Install deps
        # U-16：Windows（实际打包平台）按 requirements.lock 复现构建；
        # Linux 用 requirements.txt（锁文件由 Windows 已验证环境生成，不含 uvloop 等
        # 仅非 Windows 生效的依赖，直接用于 Linux 会漏装）。
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pip-audit
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -r requirements.lock -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Lint (Python)
        run: python -m ruff check .
      - name: Lint (frontend, U-17)
        # 前端静态防线：拼错标识符静态即报（原先只有运行时才炸）。
        # 不引入打包器——产物仍是零构建、零 CDN 的原生 <script src>。
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run lint
      - name: Dependency vulnerability audit (U-16)
        # 已知漏洞即失败。过渡期如遇「上游未修复但已评估为不可达」的条目，
        # 在此处追加 `--ignore-vuln GHSA-xxxx-xxxx-xxxx` 并在本注释下方登记原因与复查日期。
        # S2-16（R8+W）：审计对象必须是**产物实际闭包**（requirements.lock）——原实现只审浮动的
        # requirements.txt，pip 会解析到「最新」版本，与真正打包进去的锁定版本不同，
        # 等于「审计图 ≠ 产物图」（starlette CVE 就是这样漏网的）。
        shell: bash
        run: |
          python -m pip_audit -r requirements.lock --strict
          # 浮动声明侧只作「上游是否已出修复版」的前瞻提示，不参与闸门判定
          python -m pip_audit -r requirements.txt --strict \
            || echo "::warning::requirements.txt（浮动）侧存在已知漏洞——请评估升级并同步 requirements.lock"
      - name: Lock closure consistency (S2-23)
        # S2-23（R8+W）：锁文件与「从 requirements.txt 实际推导的闭包」必须完全一致，
        # 防止 dependabot/手改依赖后锁文件漂移（漏包=产物缺依赖，多包=锁文件失真）。
        run: python -m pytest -q tests/test_lock_closure.py
      - name: Test
        # --timeout 兜底；CLI 显式传入以便在 pyproject 配置之外可覆盖
        # R6-01：显式排除浏览器层——本 job 未装 chromium 时 tests/browser 会整体 skip，
        # 一旦装上 chromium 就会因 session 级 Playwright 同步上下文占住事件循环而令
        # asyncio.run() 用例失败。显式 --ignore 使本地 verify.cmd 与 CI 闸门定义等价。
        # U-12：覆盖率门槛 80%（2026-09-15 实测基线 82%；「只升不降」，不得为通过而调低）。
        run: python -m pytest -q --timeout=300 --ignore=tests/browser --cov=medkit --cov-report=term-missing --cov-fail-under=80
      - name: Migration tests (IMP-10)
        run: python -m pytest -q -m migration
      - name: Dependency integrity (IMP-10)
        run: pip check
      # R6-11（borrow-rules §5）：总闸须覆盖打包纯净检查。本 job 不构建 dist，
      # 脚本会自动打印「[跳过] …（尚未构建）」并返回 0；真实的「产物纯净 + 闭包一致」断言
      # 由下方 package job 承担（S2-19，带 --strict）。
      - name: Package purity check (R6-11)
        run: python pack/check-package.py
      # 注：tests/browser（Playwright 浏览器层）自 NX-05 起由独立 browser job 承担
      # （见下）；本 verify job 不再跑浏览器层，避免无 chromium 拖垮矩阵。

  # S2-19（R8+W）：真实打包 job —— 在**干净 runner** 里构建产物并做 --strict 纯净/闭包断言。
  # 原缺口：verify job 不构建 dist，check-package.py 直接 `[跳过] … return 0`，等于空操作；
  # 真实的纯净断言只存在于维护者本机，CI 上从未真正执行过。
  # 本 job 同时是「构建机环境污染」（S2-18）的检测闸：干净环境里若仍多出未声明发行包，
  # 说明污染来自 spec/excludes 而非环境。
  package:
    runs-on: windows-latest          # 实际打包平台
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install deps (lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pyinstaller
      - name: Build (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm medkit.spec
      - name: Package purity + closure check (--strict)
        # 未声明发行包（不在 requirements.lock 闭包内）→ 失败；无产物 → 失败。
        run: python pack/check-package.py --strict

  # NX-05（R-5）：browser 层入 CI —— 独立 job（ubuntu + chromium），
  # 失败不阻塞 verify 矩阵；浏览器二进制用 actions/cache 缓存（命中跳过安装）。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps
      - name: Browser tests (NX-05)
        run: python -m pytest tests/browser -q --timeout=300