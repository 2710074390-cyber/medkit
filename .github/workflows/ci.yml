name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      # P2#14：跨平台矩阵 —— Windows 覆盖打包/路径/命令差异，Ubuntu 快速主通道
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # P2#14：依赖缓存，命中则跳过安装，加速多平台重复运行
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        # --timeout 兜底；CLI 显式传入以便在 pyproject 配置之外可覆盖
        run: python -m pytest -q --timeout=300
      - name: Migration tests (IMP-10)
        run: python -m pytest -q -m migration
      - name: Dependency integrity (IMP-10)
        run: pip check
      # 注：tests/browser（Playwright 浏览器层）是本地闸门，CI 暂不跑——
      # CI 运行时无 chromium，跑该层会卡死/拖垮整个 job；本地用 `verify.cmd` 覆盖，
      # 无浏览器环境用 `SKIP_BROWSER=1` 旁路。