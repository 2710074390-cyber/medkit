name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      # P2#14：跨平台矩阵 —— Windows 覆盖打包/路径/命令差异，Ubuntu 快速主通道
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # P2#14：依赖缓存，命中则跳过安装，加速多平台重复运行
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - name: Install deps
        # U-16：Windows（实际打包平台）按 requirements.lock 复现构建；
        # Linux 用 requirements.txt（锁文件由 Windows 已验证环境生成，不含 uvloop 等
        # 仅非 Windows 生效的依赖，直接用于 Linux 会漏装）。
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pip-audit
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -r requirements.lock -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Lint
        run: python -m ruff check .
      - name: Dependency vulnerability audit (U-16)
        # 已知漏洞即失败。过渡期如遇「上游未修复但已评估为不可达」的条目，
        # 在此处追加 `--ignore-vuln GHSA-xxxx-xxxx-xxxx` 并在本注释下方登记原因与复查日期。
        run: python -m pip_audit -r requirements.txt --strict
      - name: Test
        # --timeout 兜底；CLI 显式传入以便在 pyproject 配置之外可覆盖
        # R6-01：显式排除浏览器层——本 job 未装 chromium 时 tests/browser 会整体 skip，
        # 一旦装上 chromium 就会因 session 级 Playwright 同步上下文占住事件循环而令
        # asyncio.run() 用例失败。显式 --ignore 使本地 verify.cmd 与 CI 闸门定义等价。
        run: python -m pytest -q --timeout=300 --ignore=tests/browser
      - name: Migration tests (IMP-10)
        run: python -m pytest -q -m migration
      - name: Dependency integrity (IMP-10)
        run: pip check
      # R6-11（borrow-rules §5）：总闸须覆盖打包纯净检查。本 job 不构建 dist，
      # 脚本会自动打印「[跳过] …（尚未构建）」并返回 0；一旦该 job 产出 dist
      # （或改为打包 job），此步即成为真实防线。与 verify.cmd 第 [4/4] 步等价。
      - name: Package purity check (R6-11)
        run: python pack/check-package.py
      # 注：tests/browser（Playwright 浏览器层）自 NX-05 起由独立 browser job 承担
      # （见下）；本 verify job 不再跑浏览器层，避免无 chromium 拖垮矩阵。

  # NX-05（R-5）：browser 层入 CI —— 独立 job（ubuntu + chromium），
  # 失败不阻塞 verify 矩阵；浏览器二进制用 actions/cache 缓存（命中跳过安装）。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps
      - name: Browser tests (NX-05)
        run: python -m pytest tests/browser -q --timeout=300