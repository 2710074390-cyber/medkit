# U-16：依赖自动更新（pip 生态，weekly）。
# 目的：上游安全通告与版本更新有固定通道，而不是靠人工发现。
# 说明：PR 一律走既有 CI 总闸（ruff / pytest / 迁移 / pip check / 打包纯净检查）。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # 2026-11-08：setuptools 的上限是**故意的**，不是忘了升。
    # `requirements-dev.txt` 里写的是 `setuptools<81`，理由是 jieba 0.42.1 仍
    # `import pkg_resources`，而 setuptools>=81 已移除它（见那行的行内注释）。
    # dependabot 每周提一次「<81 → <85」（PR #3 从 2026-09-15 挂到 11-08），
    # rebase 也不会消失——它是在把上限往上抬，正好会踩到 jieba。
    # 显式忽略，别再让它占用 PR 配额。
    ignore:
      - dependency-name: "setuptools"
        versions: [">=81"]
    # 分组：运行依赖与开发依赖分开，避免一个 PR 混入两类变更难以回滚
    groups:
      runtime:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "openai"
          - "pymupdf"
          - "python-docx"
          - "httpx"
          - "python-multipart"
          - "markdown"
          - "genanki"
          - "jieba"
          - "fsrs"
      dev:
        patterns:
          - "pytest*"
          - "playwright"
          - "freezegun"
          - "ruff"
          - "pip-audit"

  # S2-20（R8+W）：原配置只覆盖 pip——workflow 里的 actions 与前端 npm 依赖没有固定更新通道，
  # 版本靠人工盯。补齐两个生态（PR 同样走既有 CI 总闸）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(npm)"

# S2-23（R8+W）：`requirements.lock` 与 `THIRD_PARTY_NOTICES.md` 是**手写/半自动**产物，
# dependabot 不会维护它们。改依赖后必须同步两者，否则锁文件漂移——该漂移已由
# `tests/test_lock_closure.py`（闭包 == lock）+ `pack/check-package.py --strict`（产物闭包 ⊆ lock）
# 在 CI 里自动拦截，不再依赖人工记得。
