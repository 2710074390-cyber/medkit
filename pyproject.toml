[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", "dist-installer", "medkit/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "W605", "B008", "B904", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# P2#14：测试级超时兜底，避免 CI 上偶发挂起拖垮整个 job
timeout = 300
timeout_method = "thread"
markers = [
    # IMP-10：存储迁移升级/回滚/导入幂等测试（CI 单独跑 -m migration）
    "migration: 存储迁移升级/回滚/备份/JSON 幂等导入测试",
]

# U-12（R6-07）：覆盖率度量。2026-09-15 实测基线 82%（8558 语句 / 1502 未覆盖）；
# CI 门槛取 80%（留 2 点余量防抖动）——「只升不降」，不得为通过而调低。
# 说明：不放进 addopts，避免每次本地 pytest 都跑覆盖率拖慢迭代；由 CI / 需要时显式传 --cov。
[tool.coverage.run]
source = ["medkit"]
omit = ["medkit/web/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

# P3（2026-09-20）：mypy 静态类型检查基线。首轮扫描 59 errors / 19 files 已全部清零，
# 基线「只升不降」——新增代码不得引入新错误（CI 阻断）。
# 三方包无 stubs（openai / pymupdf(fitz) / python-docx / genanki / jieba / py-fsrs 等），
# 统一忽略缺失导入；warn_unused_ignores 防止 type: ignore 腐烂。
# 暂不开启 disallow_untyped_defs / check_untyped_defs：存量未标注函数较多，作为后续渐进收紧项。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
