[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", "dist-installer", "medkit/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "W605", "B008", "B904", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
